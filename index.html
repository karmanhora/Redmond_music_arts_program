<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#214d35" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="RHS Music &amp; Arts Attendance" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RHS Music &amp; Arts Attendance" />
    <meta
      name="description"
      content="One attendance platform for Redmond High School's music and arts programs."
    />
    <script>
      (() => {
        let dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          const stored = localStorage.getItem("rhs-band:dark");
          if (stored === "true") dark = true;
          if (stored === "false") dark = false;
        } catch {
          // Keep the operating-system preference when storage is unavailable.
        }
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- One mark for both colour schemes: it is a self-contained badge, so it
         does not need a dark/light pair the way an inked monogram would. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Redmond High School Music &amp; Arts Program Attendance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
